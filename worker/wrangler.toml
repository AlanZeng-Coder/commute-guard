name = "commute-guard"
main = "src/index.js"
compatibility_date = "2025-09-15"

# The browser pages import the same helpers the checker uses (time, schedule, Transitous).
[build]
command = "mkdir -p public/shared && cp ../shared/*.mjs public/shared/"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[kv_namespaces]]
binding = "CG"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# The watch (worker/src/monitor.js): every 5 minutes it checks whether a checkpoint is due or a
# commute is in progress; 511 is only polled during the user's commute windows.
[triggers]
crons = ["*/5 * * * *"]

[vars]
NTFY_SERVER = "https://ntfy.sh"
VAPID_SUBJECT = "https://github.com/AlanZeng-Coder/commute-guard"

# Secrets (scripts/setup-cloudflare.sh uploads them from ../.env):
#   APP_PASSCODE, WRITE_TOKEN, VAPID_PUBLIC_KEY, VAPID_PRIVATE_JWK, API_511_KEY,
#   ROUTINE_ID, ROUTINE_TOKEN, and optionally NTFY_TOPIC (backup push channel)
